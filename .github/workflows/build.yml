name: Build EntityBoxEsp

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch public DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Libs | Out-Null
          Invoke-WebRequest "https://github.com/LavaGang/MelonLoader/releases/latest/download/MelonLoader.x64.zip" -OutFile ml.zip
          Expand-Archive ml.zip -DestinationPath ml
          foreach ($name in "MelonLoader.dll", "Il2CppInterop.Runtime.dll") {
            $f = Get-ChildItem ml -Recurse -Filter $name | Where-Object { $_.FullName -match 'net(6|8)' } | Select-Object -First 1
            Copy-Item $f.FullName Libs/ -Force
          }
          $info = Invoke-RestMethod "https://thunderstore.io/api/experimental/package/gnonme/BoneLib/"
          Invoke-WebRequest $info.latest.download_url -OutFile bl.zip
          Expand-Archive bl.zip -DestinationPath bl
          $b = Get-ChildItem bl -Recurse -Filter BoneLib.dll | Select-Object -First 1
          Copy-Item $b.FullName Libs/ -Force
          Get-ChildItem Libs

      - name: Build
        run: dotnet build EntityBoxEsp.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: EntityBoxEsp-dll
          path: bin/Release/net6.0/EntityBoxEsp.dll
