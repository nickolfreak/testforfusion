name: Build EntityBoxEsp

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build EntityBoxEsp.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: EntityBoxEsp-dll
          path: bin/Release/net6.0/EntityBoxEsp.dll
